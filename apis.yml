aid: listen-labs
name: Listen Labs
description: 'Listen Labs is an AI-powered customer research platform that runs AI-moderated user
  interviews end to end: you define a research goal and a study guide, Listen recruits and screens
  participants from its panel or your own list, conducts multilingual voice interviews with an AI
  moderator, and then analyzes the transcripts into themes, segments, executive summaries, video
  highlight reels, and sourced quotes. The platform is programmable through a public REST API that
  lets you create a draft study from a JSON study guide, launch it to obtain a self-recruit link,
  and pull back responses, answers, transcripts, and per-question analysis. Listen Labs also
  publishes an officially hosted remote MCP server with OAuth 2.1 so agents in Claude, ChatGPT, and
  Codex can create, edit, launch, and analyze studies conversationally.'
